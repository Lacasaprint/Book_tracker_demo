    <div class="card h-terra">
      <div class="card-h"><span>${icon('tag')} Genre distribution</span><span class="ch-r">${gArr.length} genre${gArr.length===1?'':'s'}</span></div>
      <div class="card-b" style="padding:10px 16px">
        ${gArr.length ? gArr.map((g,i)=>`<div class="gbar-row"><span class="gb-l">${esc(g[0])}</span>
          <div class="prog ${['p-blue','p-rose','p-sand','p-forest','p-terra'][i%5]}"><i style="width:${pctOf(g[1],gMax)}%"></i></div>
          <span class="gb-v">${g[1]} book${g[1]===1?'':'s'}</span></div>`).join('')
        : '<div class="empty">Add genres to your books to see the mix.</div>'}
      </div>
    </div>`;

  /* formats */
  const fmap = new Map(FORMATS.map(f=>[f,0]));
  db.books.filter(b=>b.status!=='wishlist').forEach(b=>{ fmap.set(b.format,(fmap.get(b.format)||0)+1); });
  const formatCard = `
    <div class="card h-rose">
      <div class="card-h"><span>${icon('book')} Reading formats</span><span class="ch-r">library split</span></div>
      <div class="card-b" style="padding:10px 16px">
        ${FORMATS.map((f,i)=>`<div class="gbar-row"><span class="gb-l">${f}</span>
          <div class="prog ${['p-rose','p-blue','p-sand'][i]}"><i style="width:${pctOf(fmap.get(f)||0,Math.max(1,libraryBooks().length))}%"></i></div>
          <span class="gb-v">${fmap.get(f)||0}</span></div>`).join('')}
        <div class="card-note">Set the format on each book — the split updates instantly.</div>
      </div>
    </div>`;

  /* ratings distribution */
  const rmap = new Map([5,4,3,2,1].map(n=>[n,0]));
  finished.concat(booksReading()).forEach(b=>{ const r=Math.floor(b.rating); if(r>=1&&r<=5) rmap.set(r,(rmap.get(r)||0)+1); });
  const rMax = Math.max(1, ...rmap.values());
  const ratingCard = `
    <div class="card h-sand">
      <div class="card-h"><span>${icon('star')} Ratings given</span><span class="ch-r">avg ${avg?avg.toFixed(1)+'★':'—'}</span></div>
      <div class="card-b" style="padding:10px 16px">
        ${[5,4,3,2,1].map(n=>`<div class="gbar-row"><span class="gb-l">${n} star${n===1?'':'s'}</span>
          <div class="prog p-sand"><i style="width:${pctOf(rmap.get(n),rMax)}%"></i></div>
          <span class="gb-v">${rmap.get(n)}</span></div>`).join('')}
        <div class="card-note">Counts include finished and in-progress books with a rating.</div>
      </div>
    </div>`;

  /* goals summary */
  const goal = db.settings.annualGoal;
  const goalCard = `
    <div class="card h-sage">
      <div class="card-h"><span>${icon('target')} Goals</span><span class="ch-r">${TODAY.getFullYear()}</span></div>
      <div class="card-b" style="padding:10px 16px">
        <div class="gbar-row"><span class="gb-l">Annual (${goal})</span><div class="prog p-sage"><i style="width:${pctOf(finished.length,goal)}%"></i></div><span class="gb-v">${finished.length}/${goal}</span></div>
        <div class="gbar-row"><span class="gb-l">Monthly (${db.settings.monthlyGoal})</span><div class="prog p-blue"><i style="width:${pctOf(monthBooks,db.settings.monthlyGoal)}%"></i></div><span class="gb-v">${monthBooks}/${db.settings.monthlyGoal}</span></div>
        <div class="gbar-row"><span class="gb-l">Pages (${db.settings.pagesGoal.toLocaleString('en-US')})</span><div class="prog p-forest"><i style="width:${pctOf(pagesTotal,db.settings.pagesGoal)}%"></i></div><span class="gb-v">${pagesTotal.toLocaleString('en-US')}</span></div>
        ${(()=>{ const nm = nextMilestone(); return nm?`<div class="gbar-row"><span class="gb-l">Milestone (${nm.n})</span><div class="prog p-sand"><i style="width:${pctOf(nm.done,nm.n)}%"></i></div><span class="gb-v">${nm.done}/${nm.n}</span></div>`:''; })()}
        <div class="card-note">Adjust every target on the <a href="#" data-view="goals">Goals &amp; Challenges</a> page or in Settings.</div>
      </div>
    </div>`;

  el.innerHTML = `${tiles}
  <div class="st2">${pagesCard}${finCard}${genreCard}${formatCard}${ratingCard}${goalCard}</div>`;
};

/* ============================================================
   VIEW 9 — SETTINGS

INP['set-name'] = el => { db.settings.name = el.value.trim(); save(); updateMast(); };
CHG['set-goal-annual'] = el => { db.settings.annualGoal = clamp(Math.round(num(el.value,12)),1,999); save(); };
CHG['set-goal-month']  = el => { db.settings.monthlyGoal = clamp(Math.round(num(el.value,2)),1,99); save(); };
CHG['set-goal-pages']  = el => { db.settings.pagesGoal = clamp(Math.round(num(el.value,12000)),100,9999999); save(); };
CHG['set-theme'] = el => {
  db.settings.theme = el.value==='dark' ? 'dark' : 'light';
  save(); applyTheme();
};

/* ---------- export / import / CSV ---------- */
ACT['set-export'] = ()=>{
  try{
    const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'book-tracker-'+todayIso()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 500);
    toast('Export downloaded ✓');
  }catch(e){ toast('Export not possible in this browser'); }
};
ACT['set-import-open'] = ()=>{ const f=$('setImportFile'); if(f) f.click(); };
CHG['set-import'] = el=>{
  const f = el.files && el.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const p = JSON.parse(rd.result);
      if(!p || typeof p!=='object' || p.v!==1 || !Array.isArray(p.books) || !p.settings) throw new Error('format');
      db = normalizeDB(p); db.seeded = 'import';
      save(); applyTheme(); updateMast(); updateBadges(); showView('dashboard');
      toast('Import successful — welcome back ✓');
    }catch(e){ toast('Invalid file — import cancelled'); }
  };
  rd.onerror = ()=>toast('Could not read the file');
  rd.readAsText(f);
  el.value = '';
};
ACT['set-csv'] = ()=>{
  try{
    const head = ['Title','Author','Genre','Status','Pages','Current page','Rating','Start date','Finished','Series','Series order','Format','Favorite','Notes'];
    const rows = [head.join(',')];
    db.books.forEach(b=>{
      const cells = [b.title,b.author,b.genre,STATUS[b.status]?STATUS[b.status].lab:b.status,b.pages,b.current,b.rating||'',b.start,b.finished,b.series,b.seriesOrder||'',b.format,b.favorite?'yes':'no',b.notes];
      rows.push(cells.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(','));
    });
    const blob = new Blob(['\ufeff'+rows.join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'book-tracker-library.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 500);
    toast('Library CSV downloaded ✓');
  }catch(e){ toast('Export not possible in this browser'); }
};

/* ---------- demo & clear (two-step, never silent) ---------- */

  openModal(`<h3>Load the <em>demo data</em>?</h3>
    <div class="view-sub" style="margin-top:6px">Labelled sample records — 14 books across all collections, months of sessions, reviews, journal entries and goals — will be loaded so you can explore every page. <b>This replaces your current data</b> — export first if you want to keep it.</div>
    <div class="modal-actions"><button class="btn" data-act="modal-close">Cancel</button>
    <button class="btn btn-primary" data-act="set-demo-confirm">${icon('spark')} Load demo</button></div>`);
};
ACT['set-demo-confirm'] = ()=>{
  db = demoDB(); save(); closeModal();
  calY = TODAY.getFullYear(); calM = TODAY.getMonth();
  libQ=''; libStatus='all'; libGenre='all';
  applyTheme();
  toast('Demo loaded — every record is a labelled sample ✦');

ACT['set-clear'] = ()=>{
  openModal(`<h3>Delete <em>all</em> data?</h3>
    <div class="view-sub" style="margin-top:6px">This permanently deletes your books, cover uploads, every reading session, reviews, journal entries, goals and challenges in this app. <b>It cannot be undone</b> and the dashboard will return to an empty state (you can load the demo afterwards).</div>
    <div class="field" style="margin-top:12px"><span>TYPE “ERASE” TO CONFIRM</span>
      <input class="in" id="mClearConfirm" placeholder="ERASE" autocomplete="off"></div>
    <div class="modal-actions"><button class="btn" data-act="modal-close">Cancel</button>
    <button class="btn btn-primary" id="mClearBtn" data-act="set-clear-confirm" disabled style="opacity:.5;pointer-events:none">${icon('trash')} Erase everything</button></div>`);
  setTimeout(()=>{ const inp=$('mClearConfirm'); if(inp) inp.focus(); },40);
};
ACT['set-clear-confirm'] = ()=>{
  if(($('mClearConfirm').value||'').trim().toUpperCase()!=='ERASE'){ toast('Type ERASE to confirm'); return; }
  db = emptyDB(); save(); closeModal();
  toast('All data deleted — a clean slate ✦');
  updateMast(); updateBadges(); showView('dashboard');
};

/* ============================================================
   STARTUP — delegation, keyboard, first render
   ============================================================ */
document.addEventListener('click', e=>{
  /* navigation (pills, internal data-view buttons) */
  const av = e.target.closest('[data-view]');
  if(av){ showView(av.dataset.view); return; }
  /* delegated actions */
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  const fn = ACT[el.dataset.act];
  if(fn) fn(el, e);
});
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-inp]');
  if(el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e);
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-chg]');
  if(el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e);
});
/* Enter submits inline quick-adds */
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' || !e.target || !e.target.closest) return;
  const el = e.target.closest('input[data-enter]');
  if(el){ e.preventDefault(); const fn = ACT[el.dataset.enter]; if(fn) fn(el, e); }
});
/* keyboard : Escape closes the modal · Enter validates the open form */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key==='Enter' && $('modalOv').classList.contains('on') && e.target.tagName==='INPUT' && e.target.type!=='checkbox' && e.target.type!=='date'){
    e.preventDefault();
    const primary = document.querySelector('#modalBody .modal-actions .btn-primary');
    if(primary) primary.click();
  }
});
/* enable the delete-all button after typing "ERASE" */
document.addEventListener('input', e=>{
  if(e.target.id!=='mClearConfirm') return;
  const btn = $('mClearBtn'); if(!btn) return;
  const ok = (e.target.value||'').trim().toUpperCase()==='ERASE';
  btn.disabled = !ok;
  btn.style.opacity = ok? '1':'.5';
  btn.style.pointerEvents = ok? 'auto':'none';
});

/* ---------- init ---------- */
db = loadDB();
if(!db){ db = demoDB(); save(); }        /* first run: labelled demo so the app looks complete */
applyTheme();
updateMast();
(function(){
  $('mastDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
})();
updateBadges();
showView('dashboard');
</script>
