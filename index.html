<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Book Tracker — your personal reading library &amp; reading log</title>
<meta name="description" content="Book Tracker — a premium digital library: bookshelf dashboard, reading tracker, reviews, TBR &amp; wishlist, goals, series, statistics. Warm literary pastels, offline, private.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23DCE8D8'/%3E%3Cpath d='M16 14h22a8 8 0 0 1 8 8v28H24a8 8 0 0 1-8-8z' fill='%23FFFFFF' stroke='%2334483D' stroke-width='3'/%3E%3Cpath d='M46 42H24a8 8 0 0 0-8 8' fill='none' stroke='%2334483D' stroke-width='3'/%3E%3Cpath d='M26 22h12M26 29h8' stroke='%23B06A85' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BOOK TRACKER — literary pastels edition
   Design: warm ivory background · white cards · sage/rose/
   powder/sand pastels · forest green for actions & headings ·
   generous book-cover galleries · rounded corners · subtle
   shadows · premium digital-library feel.
   9 sections: dashboard · my library · reading tracker ·
   tbr & wishlist · reviews · goals & challenges ·
   series & authors · statistics · settings.
   Single file · zero dependencies · localStorage.
   ============================================================ */
:root{
  /* surfaces */
  --bg:#F7F4ED;
  --panel:#FFFFFF;
  --panel2:#FBF9F3;
  --ink:#2D352F;            /* main text        */
  --ink2:#414A42;
  --muted:#74766F;          /* secondary text   */
  --faint:#9A9C94;
  --line:#E5E3DC;           /* card border      */
  --line-in:#D8D6CE;        /* inputs           */
  --hair:#EFEDE6;           /* inner hairlines  */
  --track:#EFEDE4;

  /* literary pastels + deep accents (charts / numbers) */
  --sage:#DCE8D8;  --sage-d:#5D7F5A;  --sage-p:#F1F6EF;
  --rose:#EBD8DE;  --rose-d:#B06A85;  --rose-p:#FAF3F6;
  --blue:#DCE7F2;  --blue-d:#5B7FA6;  --blue-p:#F2F6FA;
  --sand:#F2E3C8;  --sand-d:#B08A3E;  --sand-p:#FBF6EA;
  --terra:#F3DFD2; --terra-d:#B36A4B; --terra-p:#FAF1EA;
  --forest:#34483D; --forest2:#4A6355; --forest-p:#EDF2EE;

  --pos:#5D7F5A;            /* positive / done  */
  --neg:#B3615C;            /* missed / removed */

  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;

  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(45,53,47,.05);
  --shadow-lift:0 4px 10px rgba(45,53,47,.08),0 18px 40px -24px rgba(45,53,47,.28);
  --shadow-book:0 1px 2px rgba(45,53,47,.10),0 10px 22px -12px rgba(45,53,47,.38);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sage);color:var(--ink)}
button{font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
svg{display:block}
a{color:var(--forest);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--forest2)}

/* ---------- masthead ---------- */
.mast{
  background:var(--panel);
  border-bottom:1.5px solid var(--line);
  position:sticky;top:0;z-index:60;
}
.mast-inner{
  max-width:1320px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 22px;
}
.mast-brand{display:flex;align-items:center;gap:12px;min-width:0}
.mast-emblem{
  width:40px;height:40px;flex:0 0 40px;
  background:var(--sage);border:1.5px solid var(--line);border-radius:11px;
  display:flex;align-items:center;justify-content:center;
}
.mast-emblem svg{width:22px;height:22px;stroke:var(--forest);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mast-title{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-sub{font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.mast-actions{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.mast-search{
  width:200px;padding:7px 11px;font-size:12px;font-weight:600;
  background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--r-sm);
  outline:none;transition:border-color .15s, box-shadow .15s;
}
.mast-search:focus{border-color:var(--sage-d);box-shadow:0 0 0 3px var(--sage)}
.mast-chip{
  font-size:11px;font-weight:700;letter-spacing:.05em;
  color:var(--ink);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:7px 12px;white-space:nowrap;background:var(--panel2);
}
.mast-chip b{font-variant-numeric:tabular-nums}
.mast-status{
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:var(--sage);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:7px 12px;white-space:nowrap;cursor:pointer;
}
.mast-status:hover{background:var(--sage-p)}
.mast-status.st-wait{background:var(--sand)}
.mast-status.st-done{background:var(--rose)}
.mast-date{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:7px 12px;white-space:nowrap;background:var(--panel2);
}

/* ---------- pill nav ---------- */
.pnav-wrap{background:var(--panel);border-bottom:1.5px solid var(--line);position:sticky;top:0;z-index:55}
.pnav{
  max-width:1320px;margin:0 auto;padding:10px 22px;
  display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;
}
.pnav::-webkit-scrollbar{display:none}
.pnav-item{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel);font-size:12.5px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;
  text-decoration:none;color:var(--ink);
}
.pnav-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pnav-item:hover{background:var(--sage-p)}
.pnav-item.active{background:var(--forest);color:#FFFFFF;border-color:var(--forest)}
.pnav-item.active svg{stroke:#FFFFFF}
.pnav-badge{
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--rose-d);color:#fff;font-size:10px;font-weight:800;
  display:none;align-items:center;justify-content:center;line-height:1;
}
.pnav-badge.on{display:inline-flex}


/* ---------- app & views ---------- */
.app{max-width:1320px;margin:0 auto;padding:20px 22px 8px}
.view{display:none}
.view.active{display:block;animation:vin .18s ease}
@keyframes vin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-sub{font-size:12.5px;color:var(--muted);line-height:1.55}
.view-h{font-family:var(--serif);font-weight:600;font-size:24px;margin-bottom:2px}
.view-h em{font-style:italic;color:var(--rose-d)}

/* ---------- cards ---------- */
.card{
  background:var(--panel);
  border:1.5px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:16px;
}
.card-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px;border-bottom:1.5px solid var(--line);
  font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink);min-height:40px;
}
.card-h .ch-l{display:flex;align-items:center;gap:8px;min-width:0}
.card-h .ch-l svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.card-h > span:first-child > svg:first-child{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-2px;margin-right:2px}
.card-h .ch-r{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.card-b{padding:16px 18px}
.h-sage  .card-h{background:var(--sage)}
.h-rose  .card-h{background:var(--rose)}
.h-blue  .card-h{background:var(--blue)}
.h-sand  .card-h{background:var(--sand)}
.h-terra .card-h{background:var(--terra)}
.h-forest .card-h{background:var(--forest);color:#fff;border-bottom-color:var(--forest)}
.h-forest .card-h svg{stroke:#fff}
.h-forest .card-h .ch-r{color:#C7D2C9}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel);font-size:12.5px;font-weight:700;cursor:pointer;
  letter-spacing:.02em;transition:background .15s;white-space:nowrap;
}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--sage-p)}
.btn-primary{background:var(--forest);color:#fff;border-color:var(--forest)}
.btn-primary:hover{background:var(--forest2)}
.btn-soft{background:var(--panel2)}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn-danger{background:var(--rose-p);border-color:var(--neg);color:var(--neg)}
.btn-danger:hover{background:var(--rose)}
.btn.armed{background:var(--neg);border-color:var(--neg);color:#fff !important}
.icon-btn{
  width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--panel);
  cursor:pointer;flex:0 0 auto;transition:background .15s;
}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--sage-p)}
.icon-btn.ghost{border-color:transparent;background:transparent}
.icon-btn.ghost:hover{border-color:var(--line)}
.icon-btn.fav-on svg{fill:var(--sand-d);stroke:var(--sand-d)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field > span{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.in{
  width:100%;padding:9px 11px;background:var(--panel);
  border:1.5px solid var(--line-in);border-radius:var(--r-sm);
  outline:none;transition:border-color .15s, box-shadow .15s;
}
.in:focus{border-color:var(--sage-d);box-shadow:0 0 0 3px var(--sage)}
select.in{cursor:pointer}
textarea.in{resize:vertical;min-height:74px;line-height:1.55}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:600}
.check input{width:16px;height:16px;accent-color:var(--sage-d);cursor:pointer}

/* ---------- tables & lists ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:7px 10px;border-bottom:1.5px solid var(--hair);white-space:nowrap;
}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.tot td{border-top:1.5px solid var(--line);border-bottom:0;font-weight:800;background:var(--panel2)}
.tbl tbody tr:hover{background:var(--sage-p)}
.rowlist{display:flex;flex-direction:column}
.rowitem{
  display:flex;align-items:center;gap:10px;padding:9px 2px;
  border-bottom:1px solid var(--hair);
}
.rowitem:last-child{border-bottom:0}
.rowitem .rl{flex:1;min-width:0}
.rowitem .rl .rl-t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .rl .rl-s{font-size:11px;color:var(--muted);margin-top:1px}
.done-txt{text-decoration:line-through;color:var(--faint)}

/* chips (genres, statuses, moods) */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel2);white-space:nowrap;
}
.chip .cdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.c-sage{background:var(--sage-p)} .c-sage .cdot{background:var(--sage-d)}
.c-rose{background:var(--rose-p)} .c-rose .cdot{background:var(--rose-d)}
.c-blue{background:var(--blue-p)} .c-blue .cdot{background:var(--blue-d)}
.c-sand{background:var(--sand-p)} .c-sand .cdot{background:var(--sand-d)}
.c-terra{background:var(--terra-p)} .c-terra .cdot{background:var(--terra-d)}
.c-forest{background:var(--forest-p)} .c-forest .cdot{background:var(--forest)}

/* inline icons */
svg.ico-in{display:inline-block;width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;vertical-align:-2px;margin-right:3px}
/* progress bars */
.prog{height:10px;background:var(--track);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.prog > i{display:block;height:100%;background:var(--sage-d);border-radius:5px;transition:width .3s}
.prog.p-rose > i{background:var(--rose-d)}
.prog.p-blue > i{background:var(--blue-d)}
.prog.p-sand > i{background:var(--sand-d)}
.prog.p-terra > i{background:var(--terra-d)}
.prog.p-forest > i{background:var(--forest)}
.prog.p-neg > i{background:var(--neg)}

/* chart legend line */
.chart-sub{display:flex;align-items:center;gap:14px;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.chart-sub .cs-i{display:inline-flex;align-items:center;gap:5px}
.chart-sub .cs-i i{width:9px;height:9px;border-radius:50%;display:block}

/* quick-add row */
.md-add{display:flex;gap:8px;margin-bottom:10px}
.md-add .in{flex:1;min-width:0}

/* donut (positioned center label) */
.donut{position:relative;display:inline-flex;align-items:center;justify-content:center}
.donut .dval{position:absolute;text-align:center;font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.donut .dval small{display:block;font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}

/* empty state */
.empty{padding:18px 6px;text-align:center;color:var(--faint);font-size:12.5px}
.empty b{color:var(--muted)}
.card-note{font-size:11.5px;color:var(--muted);margin-top:10px}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tiles.t5{grid-template-columns:repeat(5,1fr)}
.tiles.t6{grid-template-columns:repeat(6,1fr)}
.tile{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;background:var(--panel2)}
.tile .t-lab{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .t-num{font-family:var(--serif);font-weight:600;font-size:20px;margin-top:2px;font-variant-numeric:lining-nums tabular-nums}
.tile .t-sub{font-size:10.5px;color:var(--faint);margin-top:1px}

/* status dot */
.sdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;border:1px solid var(--line)}
.sdone{background:var(--sage-d)}
.sdue{background:var(--neg)}
.sact{background:var(--rose-d)}
.sfuture{background:var(--track)}

/* ---------- hero (first run / empty) ---------- */
.hero{
  border:1.5px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:52px 30px;text-align:center;box-shadow:var(--shadow);
}
.hero-eyebrow{font-size:10px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hero-title{font-family:var(--serif);font-weight:600;font-size:36px;line-height:1.12;margin:10px auto 8px;max-width:640px}
.hero-title em{font-style:italic;color:var(--rose-d)}
.hero-sub{font-size:13.5px;color:var(--muted);max-width:580px;margin:0 auto 22px}
.hero-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}

/* ---------- footer ---------- */
.foot{padding:26px 0 30px;text-align:center}
.foot-caps{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.foot .hand-line{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--muted);margin-top:6px}
.foot .hand-line a{color:var(--rose-d);text-decoration-thickness:1px;text-underline-offset:3px}

/* ---------- modal ---------- */
.modal-ov{
  position:fixed;inset:0;background:rgba(45,53,47,.38);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;
  overflow:auto;
}
.modal-ov.on{display:flex}
.modal{
  background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);
  width:100%;max-width:470px;padding:22px;position:relative;box-shadow:var(--shadow-lift);
}
.modal.modal-wide{max-width:620px}
.modal h3{font-family:var(--serif);font-weight:600;font-size:20px;margin-bottom:12px}
.modal h3 em{font-style:italic;color:var(--rose-d)}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.modal-x{position:absolute;top:12px;right:12px}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
  background:var(--forest);color:#fff;font-size:12.5px;font-weight:600;
  padding:11px 18px;border-radius:var(--r-sm);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:120;max-width:min(90vw,480px);text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200}

/* ---------- settings page ---------- */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.set-grid .card{margin-bottom:0}
.set-grid .mg-full{grid-column:1/-1}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--hair)}
.set-row:last-child{border-bottom:0}
.set-row .sr-lab{font-weight:600;font-size:13px}
.set-row .sr-sub{font-size:11px;color:var(--muted);margin-top:1px}
.dval{font-variant-numeric:lining-nums tabular-nums;font-weight:700;font-size:12.5px}
.lacasa{
  display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:12px 14px;background:var(--sand-p);
  text-decoration:none;color:var(--ink);
}
.lacasa:hover{background:var(--sand)}
.lc-em{width:34px;height:34px;flex:0 0 34px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:16px}
.lc-name{font-weight:700;font-size:13px}
.lc-sub{font-size:11px;color:var(--muted)}




/* ============================================================
   DASHBOARD — main column (header · 5 KPI cards · currently-
   reading gallery · charts band · recently-read · month
   matrix) + right sidebar — same structural DNA as the
   75 Days Challenge dashboard, restyled for a library.
   ============================================================ */
.dash2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.dash-main{min-width:0;display:flex;flex-direction:column;gap:16px}
.dash-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.dash2 .card{margin-bottom:0}

/* compact header card */
.d-hdr .card-b{padding:20px 22px 18px}
.dh-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dh-eyebrow{font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.dh-title{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;margin-top:5px}
.dh-title em{font-style:italic;color:var(--rose-d)}
.dh-sub{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:660px}
.dh-facts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.dh-fact{font-size:11px;font-weight:700;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;white-space:nowrap}
.dh-fact b{font-variant-numeric:tabular-nums}
.dh-actions{display:flex;gap:8px;flex-wrap:wrap}
.dh-qa{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--hair)}
.dh-qa .mini-lab{width:100%;margin-bottom:-2px}

/* KPI band — 5 pastel stat cards */
.kband{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{border:1.5px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.kpi .kp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .kp-top svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.kpi .kp-lab{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.kpi .kp-mid{display:flex;align-items:center;gap:11px}
.kpi .kp-num{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.kpi .kp-sub{font-size:10.5px;color:var(--muted);margin-top:3px}
.k-blue {background:var(--blue-p); color:var(--ink)}
.k-sage {background:var(--sage-p); color:var(--ink)}
.k-rose {background:var(--rose-p); color:var(--ink)}
.k-terra{background:var(--terra-p);color:var(--ink)}
.k-sand {background:var(--sand-p); color:var(--ink)}
.kpi .donut .dval{font-size:11.5px}

/* middle band — activity chart · annual ring · milestones · quote */
.mband{display:grid;grid-template-columns:1.3fr 1fr 1.35fr 1.05fr;gap:16px}
.mband .card{margin-bottom:0}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0}
.ring-cap{font-size:11px;color:var(--muted);text-align:center;line-height:1.5}
.ring-facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- book covers & gallery cards ---------- */
.cover{
  display:block;position:relative;aspect-ratio:2/3;width:100%;border-radius:8px;overflow:hidden;
  background:var(--panel2);border:1px solid rgba(45,53,47,.10);
  box-shadow:var(--shadow-book);
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-link{display:block;cursor:pointer}
.cover.c-thumb{width:44px;flex:0 0 44px;aspect-ratio:2/3;border-radius:5px;box-shadow:0 1px 3px rgba(45,53,47,.18)}
.cover.c-thumb-sm{width:34px;flex:0 0 34px;border-radius:4px}
.cover-link:hover .cover{box-shadow:0 2px 4px rgba(45,53,47,.14),0 14px 30px -12px rgba(45,53,47,.45)}

.bcard{
  border:1.5px solid var(--line);border-radius:var(--r);background:var(--panel);
  box-shadow:var(--shadow);padding:12px 12px 13px;display:flex;flex-direction:column;gap:7px;min-width:0;
}
.bcard .bc-t{font-weight:700;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.bcard .bc-a{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .bc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bcard .bc-foot{margin-top:auto;display:flex;align-items:center;gap:7px;padding-top:3px}
.bcard .bc-foot .prog{flex:1}
.bcard .bc-pct{font-size:10.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bcard .bc-btns{display:flex;gap:6px;margin-top:8px}
.bcard .bc-btns .btn{flex:1}

/* galleries */
.gread{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grecent{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.glib{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px}
.grecent .bcard .bc-t{font-size:12px}
.grecent .bcard .bc-btns,.grecent .bcard .bc-foot{display:none}
.grecent .bcard .bc-meta{font-size:10.5px}

/* star ratings */
.stars{position:relative;display:inline-block;line-height:0;vertical-align:-1px}
.stars .st-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap}
.stars svg{display:inline-block}
.st-lab{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* milestone rows (dashboard + goals page) */
.ms-row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--hair)}
.ms-row:last-child{border-bottom:0}
.ms-day{font-family:var(--serif);font-weight:600;font-size:14px;flex:0 0 58px;font-variant-numeric:lining-nums tabular-nums}
.ms-info{flex:1;min-width:0}
.ms-info .ms-t{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-info .ms-s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-cur{background:var(--sage-p);border-radius:8px;padding:7px 8px;margin:0 -8px}

/* ---------- reading activity matrix (month calendar) ---------- */
.mcal{min-width:600px}
.mc-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mc-nav .mc-month{font-family:var(--serif);font-weight:600;font-size:17px;margin-right:2px}
.mc-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.mc-head div{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mc-cell{
  position:relative;border:1px solid var(--hair);border-radius:7px;background:var(--panel2);
  min-height:46px;padding:5px 6px;font-size:11px;font-weight:700;color:var(--ink2);
  text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:2px;
  font-family:inherit;transition:transform .06s;
}
.mc-cell:hover{transform:scale(1.03);border-color:var(--line-in);z-index:2}
.mc-cell .pg{font-size:8.5px;font-weight:800;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mc-cell .fin{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--sage-d)}
.mc-cell.blank{background:transparent;border-color:transparent;cursor:default}
.mc-cell.blank:hover{transform:none}
.mc-cell.lv1{background:#EFF4EC}
.mc-cell.lv2{background:var(--sage)}
.mc-cell.lv3{background:#AFC79F;color:#26332A}
.mc-cell.lv3 .pg{color:#33422F}
.mc-cell.today{outline:2px solid var(--forest);outline-offset:1px}
.mc-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.mx-legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:10px}
.mx-legend .lg{display:inline-flex;align-items:center;gap:5px}
.mx-legend .lg i{width:10px;height:10px;border-radius:3px;display:block;border:1px solid var(--line)}

/* ---------- sidebar cards ---------- */
.side-card .card-b{padding:13px 15px}
.sc-goal{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.35}
.sc-why{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.sc-mini{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--hair)}
.sc-mini:last-child{border-bottom:0}
.sc-mini .sm-t{font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-book{display:flex;gap:10px;align-items:flex-start}
.side-book .sb-info{flex:1;min-width:0}
.side-book .sb-t{font-weight:700;font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.side-book .sb-a{font-size:11px;color:var(--muted);margin-top:1px}
.side-book .sb-meta{font-size:10.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.int-in{margin-top:8px}
.quote{font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.www-item{padding:7px 2px;border-bottom:1px solid var(--hair);font-size:11.5px}
.www-item:last-child{border-bottom:0}
.www-item .wi-d{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.www-item .wi-t{color:var(--ink2);margin-top:1px}
.mini-lab{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}




/* ---------- my library ---------- */
.lib-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.lib-bar .in{width:auto}
.lib-bar .search-in{flex:1;min-width:170px;max-width:300px}
.lib-count{font-size:11px;font-weight:700;color:var(--muted);margin-left:auto;white-space:nowrap}
.lib-list .cover.c-thumb{width:40px;flex:0 0 40px}
.bdetail{display:flex;gap:16px;align-items:flex-start}
.bdetail .bd-cover{flex:0 0 132px;max-width:132px}
.bdetail .bd-info{flex:1;min-width:0}
.bdetail .bd-t{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.25}
.bdetail .bd-a{font-size:12.5px;color:var(--muted);margin-top:2px}
.bdetail .bd-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bdetail .bd-notes{font-size:12px;color:var(--muted);margin-top:9px;white-space:pre-wrap}
.bdetail .bd-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.cover-pick{display:flex;gap:12px;align-items:flex-start}
.cover-pick .cp-prev{flex:0 0 96px;width:96px}
.cover-pick .cp-side{flex:1;display:flex;flex-direction:column;gap:7px}

/* ---------- reading tracker ---------- */
.trk2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.trk2 .card{margin-bottom:0}
.trk-book{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid var(--hair);align-items:flex-start}
.trk-book:last-child{border-bottom:0}
.trk-book .tb-info{flex:1;min-width:0}
.trk-book .tb-t{font-weight:700;font-size:13px;line-height:1.3}
.trk-book .tb-a{font-size:11px;color:var(--muted);margin-top:1px}
.trk-book .tb-bar{display:flex;align-items:center;gap:8px;margin-top:6px}
.trk-book .tb-bar .prog{flex:1}
.trk-book .tb-p{font-size:10.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.trk-book .tb-acts{display:flex;gap:5px;flex:0 0 auto;margin-top:2px}
.sess-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sess-form .field{margin-bottom:0}
.sess-form .f-full{grid-column:1/-1}

/* ---------- tbr & wishlist ---------- */
.tbr2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.tbr2 .card{margin-bottom:0}
.tw-row{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--hair);align-items:flex-start}
.tw-row:last-child{border-bottom:0}
.tw-row .tw-info{flex:1;min-width:0}
.tw-row .tw-t{font-weight:700;font-size:13px;line-height:1.3}
.tw-row .tw-s{font-size:11px;color:var(--muted);margin-top:1px}
.tw-row .tw-ctl{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.tw-row .tw-ctl select.in{width:auto;padding:4px 8px;font-size:11.5px}
.tw-row .tw-acts{display:flex;gap:5px;flex:0 0 auto;margin-top:2px}
.prio-High{color:var(--neg);font-weight:800}
.prio-Medium{color:var(--sand-d);font-weight:800}
.prio-Low{color:var(--muted);font-weight:800}

/* ---------- reviews ---------- */
.rev-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.rev-grid .card{margin-bottom:0}
.rev-card .card-b{display:flex;gap:13px;align-items:flex-start}
.rev-card .rv-cover{flex:0 0 86px;width:86px}
.rev-card .rv-body{flex:1;min-width:0}
.rev-card .rv-t{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.3}
.rev-card .rv-a{font-size:11.5px;color:var(--muted);margin-top:1px}
.rev-card .rv-text{font-size:12.5px;color:var(--ink2);margin-top:7px;line-height:1.55}
.rev-card .rv-quote{
  font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--ink2);
  border-left:3px solid var(--rose);padding:2px 0 2px 10px;margin-top:8px;line-height:1.5;
}
.rev-card .rv-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;font-size:10.5px;color:var(--faint)}
.rev-card .rv-acts{margin-left:auto;display:flex;gap:5px}
.star-pick{display:flex;gap:4px}
.star-pick button{all:unset;cursor:pointer;padding:2px}
.star-pick svg{width:22px;height:22px}

/* ---------- goals & challenges ---------- */
.gl2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.gl2 .card{margin-bottom:0}
.gl2 .mg-full{grid-column:1/-1}
.chal-card{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--panel2)}
.chal-card .cc-top{display:flex;align-items:center;gap:9px}
.chal-card .cc-t{font-weight:700;font-size:13.5px;flex:1;min-width:0}
.chal-card .cc-bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.chal-card .cc-bar .prog{flex:1}
.chal-card .cc-p{font-size:10.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.chal-card .cc-s{font-size:11px;color:var(--muted);margin-top:5px}
.chal-card + .chal-card{margin-top:10px}
.gl2 .chal-wrap{display:flex;flex-direction:column;gap:0}

/* ---------- series & authors ---------- */
.ser-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.ser-grid .card{margin-bottom:0}
.ser-book{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--hair);font-size:12px}
.ser-book:last-child{border-bottom:0}
.ser-book .sb-n{font-family:var(--serif);font-weight:600;color:var(--faint);flex:0 0 20px;text-align:center}
.ser-book .sb-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.auth-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.auth-card{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;background:var(--panel2)}
.auth-card .au-top{display:flex;align-items:center;gap:8px}
.auth-card .au-t{font-family:var(--serif);font-weight:600;font-size:14.5px;flex:1;min-width:0}
.auth-card .au-s{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}

/* ---------- statistics ---------- */
.st2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.st2 .card{margin-bottom:0}
.st2 .mg-full{grid-column:1/-1}
.gbar-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--hair)}
.gbar-row:last-child{border-bottom:0}
.gbar-row .gb-l{flex:0 0 130px;font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar-row .prog{flex:1}
.gbar-row .gb-v{flex:0 0 56px;text-align:right;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- dark theme ---------- */
html[data-theme="dark"]{
  --bg:#181D19; --panel:#1F2621; --panel2:#242C26;
  --ink:#EAEDE8; --ink2:#C9D0C8; --muted:#96A097; --faint:#6E786F;
  --line:#38423A; --line-in:#46524A; --hair:#28312A; --track:#272F29;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  --shadow-lift:0 4px 10px rgba(0,0,0,.3),0 18px 40px -24px rgba(0,0,0,.6);
}
html[data-theme="dark"] .card-h{color:#232A25;border-bottom-color:#38423A}
html[data-theme="dark"] .card-h .ch-r{color:#4A544C}
html[data-theme="dark"] .card-h svg{stroke:#232A25}
html[data-theme="dark"] .h-forest .card-h{background:#EAEDE8;color:#181D19;border-bottom-color:#EAEDE8}
html[data-theme="dark"] .h-forest .card-h svg{stroke:#181D19}
html[data-theme="dark"] .h-forest .card-h .ch-r{color:#4A544C}
html[data-theme="dark"] .chip{color:#232A25;border-color:#38423A}
html[data-theme="dark"] .btn-primary{background:#EAEDE8;color:#181D19;border-color:#EAEDE8}
html[data-theme="dark"] .btn-primary:hover{background:#fff}
html[data-theme="dark"] .pnav-item.active{background:#EAEDE8;color:#181D19;border-color:#EAEDE8}
html[data-theme="dark"] .pnav-item.active svg{stroke:#181D19}
html[data-theme="dark"] .mast-status,html[data-theme="dark"] .mast-chip,html[data-theme="dark"] .mast-date{color:#232A25;border-color:#38423A}
html[data-theme="dark"] .mast-chip,html[data-theme="dark"] .mast-date{background:#EAEDE8;border-color:#EAEDE8}
html[data-theme="dark"] .mast-search{background:#242C26;color:var(--ink)}
html[data-theme="dark"] .dh-fact{color:#232A25;background:#EAEDE2;border-color:#EAEDE2}
html[data-theme="dark"] .kpi{color:#232A25;border-color:#38423A}
html[data-theme="dark"] .kpi .kp-lab{color:#232A25}
html[data-theme="dark"] .kpi .kp-num{color:#232A25}
html[data-theme="dark"] .kpi .kp-sub{color:#5A645B}
html[data-theme="dark"] .kpi .donut .dval{color:#232A25}
html[data-theme="dark"] .kpi .donut .dval small{color:#5A645B}
html[data-theme="dark"] .toast{background:#EAEDE8;color:#181D19}
html[data-theme="dark"] .modal-ov{background:rgba(0,0,0,.55)}
html[data-theme="dark"] .dh-title em,html[data-theme="dark"] .hero-title em,html[data-theme="dark"] .view-h em{color:#DFAFC2}
html[data-theme="dark"] .mc-cell{color:#232A25}
html[data-theme="dark"] .mc-cell.blank{background:transparent}
html[data-theme="dark"] .mc-cell .pg{color:#4A544C}
html[data-theme="dark"] .mc-cell.today{outline-color:#EAEDE8}
html[data-theme="dark"] .mc-cell.lv3,html[data-theme="dark"] .mc-cell.lv3 .pg{color:#26332A}
html[data-theme="dark"] .mxpage .mx-lab{background:var(--panel)}
html[data-theme="dark"] .chal-card,html[data-theme="dark"] .auth-card{color:var(--ink)}
html[data-theme="dark"] .chal-card .cc-t,html[data-theme="dark"] .auth-card .au-t{color:var(--ink)}

/* ---------- responsive ---------- */
@media (min-width:1440px){
  .mast-inner,.pnav,.app{max-width:1400px}
}
@media (max-width:1240px){
  .mband{grid-template-columns:1fr 1fr}
  .kband{grid-template-columns:repeat(5,minmax(0,1fr))}
  .dash2{grid-template-columns:minmax(0,1fr) 272px}
  .gread{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grecent{grid-template-columns:repeat(4,minmax(0,1fr))}
  .auth-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1140px){
  .dash2{grid-template-columns:1fr}
  .dash-side{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .tiles.t5{grid-template-columns:repeat(3,1fr)}
  .tiles.t6{grid-template-columns:repeat(3,1fr)}
  .jr-grid,.trk2{grid-template-columns:1fr}
}
@media (max-width:820px){
  .set-grid,.st2,.gl2,.tbr2,.rev-grid,.ser-grid,.mband,.trk2{grid-template-columns:1fr}
  .dash-side{grid-template-columns:1fr}
  .kband{grid-template-columns:repeat(2,minmax(0,1fr))}

<script>




'use strict';
/* ============================================================
   BOOK TRACKER — engine
   Single file · zero dependencies · localStorage persistence
   9 sections · all statistics derived from one data store
   ============================================================ */

/* ---------- constants ---------- */
const LS_KEY = 'booktracker.v1';
const APP_VERSION = '1.0';
const MON    = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON_S  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW    = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW_S  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* reading statuses */
const STATUS = {
  reading:  {lab:'Reading',    chip:'c-rose',  hex:'#B06A85'},
  read:     {lab:'Finished',   chip:'c-sage',  hex:'#5D7F5A'},
  tbr:      {lab:'To be read', chip:'c-sand',  hex:'#B08A3E'},
  wishlist: {lab:'Wishlist',   chip:'c-blue',  hex:'#5B7FA6'}
};
const STATUS_KEYS = ['reading','read','tbr','wishlist'];
const FORMATS = ['Physical','Ebook','Audiobook'];
const PRIORITIES = ['High','Medium','Low'];
const GENRE_SEED = ['Literary Fiction','Mystery & Thriller','Historical','Fantasy','Science Fiction','Romance','Poetry','Memoir','Nature Writing','Non-fiction','Classics','Self-Development'];
const MILE_DEFAULTS = [
  {n:5,   lab:'First shelf'},
  {n:10,  lab:'Double digits'},
  {n:25,  lab:'Serious reader'},
  {n:50,  lab:'Half century'},
  {n:100, lab:'Centurion'}
];
const READING_QUOTES = [
  'A reader lives a thousand lives before he dies. — George R. R. Martin',
  'There is no friend as loyal as a book. — Ernest Hemingway',
  'Books are a uniquely portable magic. — Stephen King',
  'Reading is essential for those who seek to rise above the ordinary. — Jim Rohn',
  'The more that you read, the more things you will know. — Dr. Seuss',
  'A room without books is like a body without a soul. — Cicero',
  'Once you learn to read, you will be forever free. — Frederick Douglass',
  'So many books, so little time. — Frank Zappa',
  'Today a reader, tomorrow a leader. — Margaret Fuller',
  'Books are a mirror: see yourself in their pages and grow.',
  'Ten pages a day becomes twelve books a year.',
  'One chapter is never just one chapter — it is a door.'
];

const TODAY = new Date(); TODAY.setHours(0,0,0,0);

/* ---------- tiny utilities ---------- */
const $  = id => document.getElementById(id);
const $$ = s  => Array.from(document.querySelectorAll(s));
const pad2 = n => String(n).padStart(2,'0');
const iso  = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const fromIso = s => { if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const p=s.split('-').map(Number); const d=new Date(p[0],p[1]-1,p[2]);
  return isNaN(d.getTime())?null:d; };
const addD = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const addDIso = (s,n) => { const d=fromIso(s); return d?iso(addD(d,n)):''; };
const diffD = (a,b) => Math.round((fromIso(a)-fromIso(b))/86400000);
const todayIso = () => iso(TODAY);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
const num = (v,fb) => { const n=parseFloat(v); return isFinite(n)?n:fb; };
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function lines(s){ return String(s||'').split('\n').map(x=>x.trim()).filter(Boolean); }

/* ---------- dates in English ---------- */
function fmtDate(s){ const d=fromIso(s); return d?MON_S[d.getMonth()]+' '+d.getDate():'—'; }
function fmtDateY(s){ const d=fromIso(s); return d?MON_S[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear():'—'; }
function fmtLong(s){ const d=fromIso(s); return d?DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear():'—'; }
function fmtDow(s){ const d=fromIso(s); return d?DOW_S[d.getDay()]:'—'; }
function fmtMY(y,m){ return MON[m]+' '+y; }
const pct = n => clamp(Math.round(num(n,0)),0,999)+'%';
const pctOf = (a,b) => b>0 ? Math.round(a/b*100) : 0;
function hashStr(s){ let h=0; s=String(s||''); for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }


/* ---------- state & storage ---------- */
const ACT  = {};   /* delegated click actions        */
const INP  = {};   /* delegated input handlers       */
const CHG  = {};   /* delegated change handlers      */
const RENDER = {}; /* per-view renderers             */
let view = 'dashboard';
let db = null;
let libQ = '', libStatus = 'all', libGenre = 'all', libSort = 'added', libView = 'gallery';
let calY = TODAY.getFullYear(), calM = TODAY.getMonth();  /* activity matrix month */
let revBook = '';   /* review modal preselected book  */

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  catch(e){ toast('Storage full or unavailable — recent changes may not be kept'); }
}
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    if(p && p.v===1) return normalizeDB(p);
  }catch(e){}
  return null;
}
function normalizeDB(d){
  d.v = 1;
  d.settings = Object.assign({name:'', annualGoal:12, monthlyGoal:2, pagesGoal:12000, theme:'light'}, d.settings||{});
  d.settings.annualGoal  = clamp(Math.round(num(d.settings.annualGoal,12)),1,999);
  d.settings.monthlyGoal = clamp(Math.round(num(d.settings.monthlyGoal,2)),1,99);
  d.settings.pagesGoal   = clamp(Math.round(num(d.settings.pagesGoal,12000)),100,9999999);
  if(d.settings.theme!=='dark') d.settings.theme = 'light';
  d.books = Array.isArray(d.books) ? d.books : [];
  d.books.forEach(b=>{
    if(!b.id) b.id = uid();
    b.title  = String(b.title||'Untitled').slice(0,120);
    b.author = String(b.author||'').slice(0,80);
    b.genre  = String(b.genre||'').slice(0,40);
    b.pages  = clamp(Math.round(num(b.pages,0)),0,99999);
    b.current= clamp(Math.round(num(b.current,0)),0,b.pages||99999);
    b.status = STATUS[b.status] ? b.status : 'tbr';
    b.rating = clamp(num(b.rating,0),0,5);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(b.start||'')) b.start='';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(b.finished||'')) b.finished='';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(b.added||'')) b.added=todayIso();
    b.series = String(b.series||'').slice(0,80);
    b.seriesOrder = clamp(Math.round(num(b.seriesOrder,0)),0,99);
    b.format = FORMATS.includes(b.format) ? b.format : 'Physical';
    b.priority = PRIORITIES.includes(b.priority) ? b.priority : 'Medium';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(b.target||'')) b.target='';
    b.notes  = String(b.notes||'').slice(0,1000);
    b.favorite = !!b.favorite;
    b.cover  = typeof b.cover==='string' && b.cover.length>30 ? b.cover : '';
    b.cs = Math.round(num(b.cs,0)) || 0;
  });
  d.sessions = Array.isArray(d.sessions) ? d.sessions : [];
  d.sessions.forEach(s=>{
    if(!s.id) s.id = uid();
    s.bookId = String(s.bookId||'');
    s.date = fromIso(s.date)?s.date:todayIso();
    s.pages = clamp(Math.round(num(s.pages,0)),0,9999);
    s.from = Math.round(num(s.from,0))||''; if(s.from===0&&!num(s.from,0)) s.from='';
    s.to   = Math.round(num(s.to,0))||'';   if(s.to===0&&!num(s.to,0)) s.to='';
    s.minutes = clamp(Math.round(num(s.minutes,0)),0,1440)||'';
    s.note = String(s.note||'').slice(0,300);
  });
  d.reviews = Array.isArray(d.reviews) ? d.reviews : [];
  d.reviews.forEach(r=>{
    if(!r.id) r.id = uid();
    r.bookId = String(r.bookId||'');
    r.rating = clamp(num(r.rating,0),0,5);
    r.text   = String(r.text||'').slice(0,2000);
    r.quotes = String(r.quotes||'').slice(0,1000);
    r.date   = fromIso(r.date)?r.date:todayIso();
  });
  d.journal = (d.journal && typeof d.journal==='object' && !Array.isArray(d.journal)) ? d.journal : {};
  Object.keys(d.journal).forEach(k=>{
    if(!fromIso(k)){ delete d.journal[k]; return; }
    const j = d.journal[k] || {};
    d.journal[k] = { intention:String(j.intention||'').slice(0,160), quote:String(j.quote||'').slice(0,300), note:String(j.note||'').slice(0,600) };
  });
  d.milestones = Array.isArray(d.milestones) && d.milestones.length ? d.milestones : JSON.parse(JSON.stringify(MILE_DEFAULTS));
  d.milestones = d.milestones.slice(0,6).map(m=>({ n:clamp(Math.round(num(m.n,5)),1,9999), lab:String(m.lab||'Milestone').slice(0,40) }));
  d.challenges = Array.isArray(d.challenges) ? d.challenges : [];
  d.challenges.forEach(c=>{
    if(!c.id) c.id = uid();
    c.name = String(c.name||'Challenge').slice(0,60);
    c.type = ['books','pages','genre'].includes(c.type) ? c.type : 'books';
    c.genre = String(c.genre||'').slice(0,40);
    c.target = clamp(Math.round(num(c.target,1)),1,999999);
  });
  d.favAuthors = Array.isArray(d.favAuthors) ? d.favAuthors.map(a=>String(a).slice(0,80)) : [];
  return d;
}
/* empty state (after Delete All) */
function emptyDB(){
  return normalizeDB({ v:1, seeded:'empty',
    settings:{ name:(db&&db.settings.name)||'', theme:(db&&db.settings.theme)||'light',
               annualGoal:(db&&db.settings.annualGoal)||12, monthlyGoal:(db&&db.settings.monthlyGoal)||2,
               pagesGoal:(db&&db.settings.pagesGoal)||12000 } });
}
function isEmpty(){
  return db.seeded!=='demo' && !db.books.length && !db.sessions.length && !db.reviews.length && !Object.keys(db.journal).length;
}

/* ============================================================
   BOOK MATH — every figure on screen is computed here
   ============================================================ */
function bookById(id){ return db.books.find(b=>b.id===id); }
function libraryBooks(){ return db.books.filter(b=>b.status!=='wishlist'); }
function booksRead(){ return db.books.filter(b=>b.status==='read'); }
function booksReading(){ return db.books.filter(b=>b.status==='reading'); }
function booksTBR(){ return db.books.filter(b=>b.status==='tbr'); }
function booksWishlist(){ return db.books.filter(b=>b.status==='wishlist'); }
/* pages read of a single book — finished counts in full, reading counts progress, no double counting */
function pagesOfBook(b){
  if(b.status==='read') return Math.max(0, num(b.pages,0));
  if(b.status==='reading') return clamp(Math.round(num(b.current,0)),0,num(b.pages,0)||99999);
  return 0;
}
function pagesReadTotal(){ return db.books.reduce((a,b)=>a+pagesOfBook(b),0); }
function genreList(){
  const set = new Set(db.books.map(b=>b.genre).filter(Boolean));
  GENRE_SEED.forEach(g=>set.add(g));
  return Array.from(set).sort();
}
/* sessions on a given date */
function sessionsOn(dateIso){ return db.sessions.filter(s=>s.date===dateIso); }
function pagesOnDate(dateIso){ return sessionsOn(dateIso).reduce((a,s)=>a+s.pages,0); }
function sessionsInMonth(y,m){ return db.sessions.filter(s=>{ const d=fromIso(s.date); return d && d.getFullYear()===y && d.getMonth()===m; }); }
function pagesInMonth(y,m){ return sessionsInMonth(y,m).reduce((a,s)=>a+s.pages,0); }
function booksFinishedInMonth(y,m){ return booksRead().filter(b=>{ const d=fromIso(b.finished); return d && d.getFullYear()===y && d.getMonth()===m; }); }
function pagesLastNMonths(n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth()-i, 1);
    out.push({ y:d.getFullYear(), m:d.getMonth(), lab:MON_S[d.getMonth()], pages:pagesInMonth(d.getFullYear(),d.getMonth()), books:booksFinishedInMonth(d.getFullYear(),d.getMonth()).length });
  }
  return out;
}
/* reading streak — consecutive days with at least one logged session */
function readingStreaks(){
  const days = new Set(db.sessions.map(s=>s.date));
  if(!days.size) return {cur:0, best:0};
  const sorted = Array.from(days).sort();
  /* longest run overall */
  let best=1, run=1;
  for(let i=1;i<sorted.length;i++){
    if(diffD(sorted[i], sorted[i-1])===1){ run++; if(run>best) best=run; }
    else run=1;
  }
  /* current streak: counts back from today (or yesterday if nothing yet today) */
  let cur=0, anchor = days.has(todayIso()) ? todayIso() : addDIso(todayIso(),-1);
  while(days.has(anchor)){ cur++; anchor = addDIso(anchor,-1); }
  return {cur, best};
}
/* avg rating of books that carry a rating */
function avgRating(){
  const rs = db.books.filter(b=>b.rating>0).map(b=>b.rating);
  return rs.length ? (rs.reduce((a,b)=>a+b,0)/rs.length) : 0;
}
/* reading pace for the annual goal */
function yearPace(){
  const start = new Date(TODAY.getFullYear(),0,1);
  const monthsElapsed = TODAY.getMonth() + (TODAY.getDate()>=15 ? 0.5 : 0);
  return { monthsElapsed: Math.max(monthsElapsed, 0.5), monthsLeft: 12 - TODAY.getMonth() - 1 };
}
/* milestones — states computed strictly from finished books */
function sortedFinishedDates(){ return booksRead().map(b=>b.finished).filter(Boolean).sort(); }
function milestoneState(idx){
  const done = booksRead().length;
  const m = db.milestones[idx];
  if(done>=m.n) return 'done';
  for(let i=0;i<db.milestones.length;i++){
    if(booksRead().length < db.milestones[i].n) return i===idx ? 'current' : 'upcoming';
  }
  return 'upcoming';
}
function nextMilestone(){
  const done = booksRead().length;
  for(let i=0;i<db.milestones.length;i++){
    if(done < db.milestones[i].n) return {idx:i, n:db.milestones[i].n, lab:db.milestones[i].lab, done, need:db.milestones[i].n-done};
  }
  return null;
}
/* challenge progress (books | pages | genre) */
function challengeProg(c){
  if(c.type==='pages') return { done:pagesReadTotal(), target:c.target, unit:'pages' };
  if(c.type==='genre'){
    const g = c.genre.toLowerCase();
    const done = booksRead().filter(b=>(b.genre||'').toLowerCase()===g).length;
    return { done, target:c.target, unit:'books' };
  }
  return { done:booksRead().length, target:c.target, unit:'books' };
}
/* series & authors */
function seriesMap(){
  const map = new Map();
  db.books.filter(b=>b.series).forEach(b=>{
    if(!map.has(b.series)) map.set(b.series, []);
    map.get(b.series).push(b);
  });
  map.forEach(arr=>arr.sort((a,b)=>(a.seriesOrder||99)-(b.seriesOrder||99) || a.title.localeCompare(b.title)));
  return map;
}
function authorMap(){
  const map = new Map();
  db.books.forEach(b=>{
    const a = (b.author||'').trim(); if(!a) return;
    if(!map.has(a)) map.set(a, []);
    map.get(a).push(b);
  });
  return map;
}

function wrapTitle(t, maxLen, maxLines){
  const words = String(t||'Untitled').split(/\s+/);
  const out=[]; let cur='';
  for(const w of words){
    const cand = cur ? cur+' '+w : w;
    if(cand.length<=maxLen) cur=cand;
    else { if(cur) out.push(cur); cur=w; }
    if(out.length===maxLines) break;
  }
  if(out.length<maxLines && cur) out.push(cur);
  if(out.length===maxLines){
    let used = out.join(' ').length, total = words.join(' ').length;
    if(used < total-1){ out[maxLines-1] = out[maxLines-1].replace(/[.,;:]$/,'') + '…'; }
  }
  return out;
}
function coverArt(b){
  const genre = String(b.genre||'').toLowerCase();
  let scene = 'coast';
  if(/historical|fantasy|adventure|folklore/.test(genre)) scene = 'forest';
  else if(/mystery|thriller|crime|science fiction|sci-fi/.test(genre)) scene = 'noir';
  else if(/nature|poetry|botanical|science|travel/.test(genre)) scene = 'botanical';
  else if(!genre){
    const keys = Object.keys(COVER_SCENES);
    scene = keys[Math.abs(hashStr(String(b.title||'')+'|'+String(b.author||''))) % keys.length];
  }
  const lightText = scene==='forest' || scene==='noir';
  const ink = lightText ? '#F8F1DF' : '#25372D';
  const stroke = lightText ? '#1E2A23' : '#F6E9D0';
  const title = String(b.title||'Untitled');
  const lines = wrapTitle(title, 18, 4);
  const gap = lines.length>3 ? 25 : 29;
  const size = title.length>30 ? 21 : title.length>22 ? 23 : 27;
  const titleY = ({forest:226, coast:156, noir:220, botanical:205})[scene];
  const firstY = titleY - ((lines.length-1)*gap)/2;
  const titleSvg = lines.map((line,i)=>`<text x="160" y="${firstY+i*gap}" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="${size}" font-weight="700" letter-spacing="-.25" fill="${ink}" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke">${esc(line)}</text>`).join('');
  const footerFill = lightText ? '#142019' : '#FFF6E5';
  const footerOpacity = lightText ? '.36' : '.76';
  const author = String(b.author||'').toUpperCase().slice(0,34);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480">
    <image href="${COVER_SCENES[scene]}" width="320" height="480" preserveAspectRatio="xMidYMid slice"/>
    <rect x="9" y="9" width="302" height="462" rx="1" fill="none" stroke="${lightText?'#E9D2A1':'#7E8A70'}" stroke-width="1.1" opacity=".62"/>
    ${titleSvg}
    <rect x="14" y="411" width="292" height="53" fill="${footerFill}" opacity="${footerOpacity}"/>
    <path d="M104 421 H216" stroke="${ink}" stroke-width=".8" opacity=".62"/>
    <text x="160" y="443" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11.5" letter-spacing="2.1" fill="${ink}">${esc(author)}</text>
    <text x="160" y="457" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" letter-spacing="2.5" fill="${ink}" opacity=".82">YOUR READING LIBRARY</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function coverImg(b, cls){
  const src = b.cover ? b.cover : coverArt(b);
  return `<span class="cover ${cls||''}"><img src="${src}" alt="${esc(b.title)} cover" loading="lazy" draggable="false"></span>`;
}

/* ---------- SVG charts (literary pastel palette) ---------- */
const CH = {sage:'#5D7F5A', rose:'#B06A85', blue:'#5B7FA6', sand:'#B08A3E', terra:'#B36A4B', forest:'#34483D',
            grid:'#EFEDE6', lab:'#9A9C94', track:'#EFEDE4'};

function donutSVG(size, stroke, segs, centerTop, centerSub){
  const r = (size - stroke)/2, cx = size/2, cy = size/2;
  let off = 0, rings = '';
  for(const s of segs){
    const p = clamp(s.pct, 0, 100);
    rings += `<circle cx="${cx}" cy="${cy}" r="${r}" pathLength="100" style="stroke:${s.color}" stroke-width="${stroke}" fill="none" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}" stroke-linecap="butt"/>`;
    off += p;
  }
  return `<span class="donut"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" pathLength="100" style="stroke:${CH.track}" stroke-width="${stroke}" fill="none"/>${rings}</svg>
    <span class="dval">${centerTop||''}${centerSub?`<small>${centerSub}</small>`:''}</span></span>`;
}
function vbars(opts){
  const {w,h,vals,labels} = opts;
  const max = opts.max || Math.max(1, ...vals.map(v=>num(v,0)));
  const n = vals.length || 1;
  const padB = 18, padT = 4;
  const cw = w/n, bw = Math.min(34, cw*0.55);
  let bars='', labs='';
  for(let i=0;i<n;i++){
    const v = num(vals[i],0);
    const bh = v>0 ? Math.max(3, (h-padB-padT) * (v/max)) : 2;
    const x = i*cw + (cw-bw)/2, y = h-padB-bh;
    const c = opts.colorFn ? opts.colorFn(v,i) : (opts.color||CH.sage);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" style="fill:${c}"><title>${esc(labels[i])} : ${opts.fmt?opts.fmt(v):v}</title></rect>`;
    labs += `<text x="${(i*cw+cw/2).toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="8.5" font-weight="700" style="fill:${CH.lab}">${esc(labels[i])}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block" role="img">${bars}${labs}</svg>`;
}
function lineChart(opts){
  const {w,h,vals,labels} = opts;
  if(!vals.length) return '<div class="empty">No data yet</div>';
  const padL = opts.padL||34, padR = 10, padT = 12, padB = 20;
  let mn = 0, mx = Math.max(1, ...vals);
  const iw = w-padL-padR, ih = h-padT-padB;
  const X = i => padL + (vals.length===1 ? iw/2 : iw*i/(vals.length-1));
  const Y = v => padT + ih*(1-(v-mn)/(mx-mn));
  let grid='', pts='', labs='';
  for(let g=0; g<4; g++){
    const v = mn + (mx-mn)*g/3, y = Y(v);
    grid += `<line x1="${padL}" x2="${w-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${CH.grid}"/>`+
            `<text x="${padL-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" font-weight="700" style="fill:${CH.lab}">${opts.fmt?opts.fmt(v):Math.round(v)}</text>`;
  }
  const path = vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  vals.forEach((v,i)=>{
    pts += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" style="fill:${opts.color||CH.sage}" stroke="#fff" stroke-width="1.2"><title>${esc(labels[i])} : ${opts.fmt?opts.fmt(v):v}</title></circle>`;
    if(labels.length<=16 || i%Math.ceil(labels.length/12)===0)
      labs += `<text x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="8" font-weight="700" style="fill:${CH.lab}">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block" role="img"><line x1="${padL}" x2="${padL}" y1="${padT}" y2="${h-padB}" style="stroke:${CH.grid}"/>${grid}<path d="${path}" fill="none" style="stroke:${opts.color||CH.sage}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${pts}${labs}</svg>`;
}
/* star rating (0–5, supports halves via width fill) */
function starsHtml(r, size){

  const one = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="stroke:var(--sand-d);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8-5.2-2.9-5.2 2.9 1.2-5.8-4.4-4 5.9-.7z"/></svg>`;

function splitPages(total, k){
  if(k<=0) k=1;
  const arr=[]; let rem=total;
  for(let i=0;i<k;i++){
    const left = k-i;
    let p = Math.max(1, Math.round(rem/left) + (((i*37)%13)-6));
    p = Math.min(p, Math.max(1, rem-(left-1)));
    arr.push(p); rem-=p;
  }
  if(rem>0) arr[arr.length-1] += rem;
  return arr;
}
function pushSessions(d, book, dates, pagesArr, withFrom){

    if(withFrom && i%2===0){ s.from = 1; s.to = pagesArr[i]; }
    d.sessions.push(s);
  });
}

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(x, y){
  if(REDUCED) return;
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#DCE8D8','#EBD8DE','#DCE7F2','#F2E3C8','#F3DFD2','#5D7F5A','#B06A85','#34483D'];
  const parts = Array.from({length:70},()=>({
    x, y, vx:(Math.random()-.5)*11, vy:-(Math.random()*8+4),
    s:Math.random()*5+3, c:colors[Math.floor(Math.random()*colors.length)],
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life:1
  }));
  const t0 = performance.now();
  (function frame(t){
    const dt = (t-t0)/1000;
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive=false;
    for(const p of parts){
      p.vy += .28; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.life = 1 - dt/1.35;
      if(p.life>0 && p.y<cv.height+20){
        alive=true;
        ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62); ctx.restore();
      }
    }
    if(alive) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}
function confettiCenter(){ confetti(innerWidth/2, innerHeight*0.35); }
/* two-step delete ("Sure?") */
let armTimer = null;
function armDelete(el, fn){
  if(el.classList.contains('armed')){ fn(); return; }
  $$('.armed').forEach(b=>{ b.classList.remove('armed'); b.innerHTML = b.dataset.orig || b.innerHTML; });
  el.dataset.orig = el.innerHTML;
  el.classList.add('armed'); el.innerHTML = 'Sure?';
  clearTimeout(armTimer);
  armTimer = setTimeout(()=>{ el.classList.remove('armed'); el.innerHTML = el.dataset.orig || el.innerHTML; }, 2400);
}

function updateMast(){
  const st = $('mastStatus');
  if(st){
    const n = booksReading().length;
    st.textContent = n ? n+' reading now' : 'Library at rest';
    st.classList.toggle('st-wait', n===0);
    st.classList.toggle('st-done', booksRead().length>0 && n===0);
  }
}
function updateBadges(){
  const t = document.querySelector('[data-badge="tracker"]');
  if(t){ const n = booksReading().length; t.textContent = n; t.classList.toggle('on', n>0); }
  const w = document.querySelector('[data-badge="tbr"]');
  if(w){ const n = booksTBR().length + booksWishlist().length; w.textContent = n; w.classList.toggle('on', n>0); }
}

/* ============================================================
   SHARED — book cards, progress, session rows
   ============================================================ */
function bookPct(b){ return b.pages>0 ? pctOf(pagesOfBook(b), b.pages) : 0; }
/* big card for the Currently Reading gallery */
function readingCard(b){
  const p = bookPct(b);
  return `<div class="bcard">
    <span class="cover-link" data-act="book-details" data-id="${b.id}">${coverImg(b)}</span>
    <div class="bc-t">${esc(b.title)}</div>
    <div class="bc-a">${esc(b.author||'—')}</div>
    <div class="bc-meta">${statusChip(b.status)}<span>${pagesOfBook(b)} / ${b.pages||'?'} pages</span></div>
    <div class="bc-foot"><div class="prog p-rose"><i style="width:${p}%"></i></div><span class="bc-pct">${p}%</span></div>
    <div class="bc-btns">
      <button class="btn btn-primary btn-sm" data-act="sess-quick" data-id="${b.id}">${icon('book')} Continue</button>
      <button class="icon-btn" data-act="book-details" data-id="${b.id}" aria-label="Details" style="width:28px;height:28px">${icon('search')}</button>
    </div>
  </div>`;
}
/* compact card for Recently Read + library gallery */
function shelfCard(b, opts){
  opts = opts||{};
  const p = bookPct(b);
  const meta = [];
  if(b.status==='read' && b.finished) meta.push('Finished '+esc(fmtDate(b.finished)));
  else if(b.status==='reading') meta.push(pagesOfBook(b)+' / '+(b.pages||'?')+' pg');
  else if(b.status==='tbr' && b.target) meta.push('Target '+esc(fmtDate(b.target)));
  else if(b.status==='wishlist') meta.push('Saved '+esc(fmtDate(b.added)));
  if(b.rating>0) meta.push('');
  return `<div class="bcard">
    <span class="cover-link" data-act="book-details" data-id="${b.id}">${coverImg(b)}</span>
    <div class="bc-t">${esc(b.title)}</div>
    <div class="bc-a">${esc(b.author||'—')}</div>
    ${b.rating>0?`<div>${starsHtml(b.rating,11)}</div>`:''}
    <div class="bc-meta">${statusChip(b.status)}${meta[0]?`<span>${meta[0]}</span>`:''}</div>
    ${opts.progress && b.status==='reading' ? `<div class="bc-foot"><div class="prog p-rose"><i style="width:${p}%"></i></div><span class="bc-pct">${p}%</span></div>`:''}
  </div>`;
}
/* small session row (history tables) */
function sessRow(s){
  const b = bookById(s.bookId);
  const rng = (s.from!=='' && s.to!=='') ? `${s.from}&ndash;${s.to}` : '&mdash;';
  return `<tr>
    <td style="white-space:nowrap">${esc(fmtDate(s.date))}</td>
    <td><b>${b?esc(b.title):'<span style="color:var(--faint)">Removed book</span>'}</b>${s.note?`<div style="font-size:11px;color:var(--muted)">${esc(s.note)}</div>`:''}</td>
    <td class="r"><b>+${s.pages}</b></td>
    <td class="r">${rng}</td>
    <td class="r">${s.minutes!==''?s.minutes+' min':'&mdash;'}</td>
    <td class="r" style="white-space:nowrap">
      <button class="icon-btn" data-act="sess-edit" data-id="${s.id}" aria-label="Edit session" style="width:26px;height:26px">${icon('pencil')}</button>
      <button class="icon-btn" data-act="sess-del" data-id="${s.id}" aria-label="Delete session" style="width:26px;height:26px">${icon('trash')}</button>
    </td>
  </tr>`;
}
/* quote of the day — rotates daily */
function quoteOfDay(){
  const day = Math.floor(Date.now()/86400000);
  return READING_QUOTES[day % READING_QUOTES.length];
}
/* journal helpers — one entry per date */
function journalUpsert(dateIso, field, value){
  const j = db.journal[dateIso] || (db.journal[dateIso]={intention:'',quote:'',note:''});
  j[field] = String(value||'');
  if(!j.intention.trim() && !j.quote.trim() && !j.note.trim()) delete db.journal[dateIso];
}

/* ============================================================
   SHARED — month activity matrix (dashboard + statistics)
   ============================================================ */
function monthMatrixHtml(){
  const y = calY, m = calM;
  const first = new Date(y, m, 1);
  const startDow = (first.getDay()+6)%7;               /* Monday-first */
  const nDays = new Date(y, m+1, 0).getDate();
  const tIso = todayIso();
  const sessionsM = sessionsInMonth(y,m);
  const pagesM = sessionsM.reduce((a,s)=>a+s.pages,0);
  const finishedM = booksFinishedInMonth(y,m);

  /* intensity levels from the month's max day */
  let maxDay = 1;
  for(let d=1; d<=nDays; d++){ maxDay = Math.max(maxDay, pagesOnDate(iso(new Date(y,m,d)))); }
  const t1 = Math.max(1, Math.round(maxDay/3)), t2 = Math.max(2, Math.round(maxDay*2/3));

  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<span class="mc-cell blank"></span>';
  for(let d=1; d<=nDays; d++){
    const ds = iso(new Date(y,m,d));
    const pg = pagesOnDate(ds);
    const sN = sessionsOn(ds).length;
    const fin = booksFinishedInMonth(y,m).some(b=>b.finished===ds);
    const lv = pg<=0 ? '' : (pg<=t1 ? ' lv1' : (pg<=t2 ? ' lv2' : ' lv3'));
    cells += `<button class="mc-cell${lv}${ds===tIso?' today':''}" data-act="cal-day" data-date="${ds}"
      title="${esc(fmtLong(ds))} — ${pg?pg+' pages in '+sN+' session'+(sN===1?'':'s'):'no reading logged'}${fin?' · book finished':''}">
      <span>${d}</span>
      ${fin?'<span class="fin" title="Book finished"></span>':''}
      ${pg?`<span class="pg">${pg} pg${sN>1?' · '+sN+'×':''}</span>`:'<span class="pg">&nbsp;</span>'}
    </button>`;
  }
  const trail = (7 - (startDow+nDays)%7)%7;
  for(let i=0;i<trail;i++) cells += '<span class="mc-cell blank"></span>';

  const head = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('');
  return `

function libFiltered(){
  let arr = db.books.slice();
  const q = libQ.trim().toLowerCase();
  if(q) arr = arr.filter(b=>(b.title+' '+b.author+' '+b.genre+' '+b.series).toLowerCase().includes(q));
  if(libStatus!=='all') arr = arr.filter(b=>b.status===libStatus);
  if(libGenre!=='all') arr = arr.filter(b=>b.genre===libGenre);
  const by = {
    title:    (a,b)=>a.title.localeCompare(b.title),
    author:   (a,b)=>(a.author||'').localeCompare(b.author||''),
    added:    (a,b)=>(b.added||'').localeCompare(a.added||''),
    finished: (a,b)=>(b.finished||'').localeCompare(a.finished||''),
    rating:   (a,b)=>b.rating-a.rating
  }[libSort] || ((a,b)=>0);
  return arr.sort(by);
}

CHG['book-cover'] = el=>{
  const f = el.files && el.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      /* downscale to max 760px on the long edge, JPEG — keeps localStorage happy */
      const maxD = 760;
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxD/Math.max(w,h));
      w = Math.max(1,Math.round(w*scale)); h = Math.max(1,Math.round(h*scale));
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      let data;
      try{ data = cv.toDataURL('image/jpeg', 0.82); }
      catch(e){ toast('Could not process that image'); return; }
      $('mBCoverData').value = data;
      $('mBCoverPrev').src = data;
      toast('Cover attached ✓');
    };
    img.onerror = ()=>toast('That file is not a readable image');
    img.src = rd.result;
  };
  rd.onerror = ()=>toast('Could not read the file');
  rd.readAsDataURL(f);
  el.value = '';
};
ACT['book-save'] = el=>{
  const id = el.dataset.id;
  const title = ($('mBTitle').value||'').trim();
  if(!title){ toast('Give the book a title'); return; }
  const status = $('mBStatus').value;
  const pages = clamp(Math.round(num($('mBPages').value,0)),0,99999);
  let current = clamp(Math.round(num($('mBCurrent').value,0)),0,pages||99999);
  const coverData = $('mBCoverData').value;
  const data = {
    title, author:($('mBAuthor').value||'').trim(), genre:($('mBGenre').value||'').trim(),
    pages, current, status,
    rating: num($('mBRating').value,0),
    start: $('mBStart').value||'', finished: $('mBFinished').value||'',
    series:($('mBSeries').value||'').trim(), seriesOrder: clamp(Math.round(num($('mBOrder').value,0)),0,99),
    format: $('mBFormat').value, notes: $('mBNotes').value||'',
    favorite: !!($('mBFav').checked),
    target: $('mBTarget').value||''
  };
  if(status==='read' && !data.finished) data.finished = todayIso();
  if(status!=='read') { /* keep finished if user set it manually */ }
  if(status==='reading' && !data.start) data.start = todayIso();
  let b;
  if(id){
    b = bookById(id);
    if(!b){ toast('Book not found'); return; }
    Object.assign(b, data);
  } else {
    b = Object.assign({id:uid(), cover:'', cs:(hashStr(title)%8)+((hashStr(data.author)%8)*8), added:todayIso()}, data);
    db.books.unshift(b);
  }
  if(coverData && coverData!=='1' && coverData.length>30) b.cover = coverData;
  if(coverData==='' ) b.cover = '';
  if(coverData==='1' && !b.cover) b.cover = '';
  save(); closeModal(); refresh();
  logActLite('Book “'+title+'” '+(id?'updated':'added to the library'));
  toast(id?'Book updated ✓':'Book added to your library ✓');
  if(!id && status==='read') confettiCenter();
};
ACT['book-del'] = el=>{

/* apply a session delta to book progress — never double counts */
function applySessionDelta(book, oldPages, newPages){
  if(!book) return;
  const delta = (newPages||0) - (oldPages||0);
  if(!delta) return;
  book.current = clamp((num(book.current,0)) + delta, 0, book.pages||99999);
}
function checkAutoFinish(book, sessDate){
  if(book && book.status==='reading' && book.pages>0 && book.current>=book.pages){
    book.status = 'read'; book.finished = sessDate || todayIso(); book.current = book.pages;
    return true;
  }
  return false;
}
ACT['sess-form-add'] = ()=>{
  const bookId = ($('fSessBook')||{}).value;
  const b = bookById(bookId);
  if(!b){ toast('Pick a book that is in progress'); return; }
  const date = $('fSessDate').value || todayIso();
  let pages = Math.round(num($('fSessPages').value,0));
  const from = $('fSessFrom').value===''?'':Math.round(num($('fSessFrom').value,0));
  const to = $('fSessTo').value===''?'':Math.round(num($('fSessTo').value,0));
  if(from!=='' && to!=='' && to>from) pages = to-from+1;
  if(pages<=0){ toast('How many pages did you read?'); return; }
  const s = {id:uid(), bookId:b.id, date, pages, from, to, minutes: $('fSessMin').value===''?'':clamp(Math.round(num($('fSessMin').value,0)),0,1440), note:($('fSessNote').value||'').trim()};
  const wasFinished = b.status==='read';
  applySessionDelta(b, 0, pages);
  db.sessions.push(s);
  const justFinished = !wasFinished && checkAutoFinish(b, date);
  save(); refresh();
  if(justFinished){ confettiCenter(); toast('"'+b.title.slice(0,28)+'" finished — automatically marked as read!'); }
  else toast('Session logged — +'+pages+' pages ✓');
  if(RENDER.tracker) RENDER.tracker();
};
ACT['sess-save'] = el=>{
  const id = el.dataset.id;
  const bId = ($('mSessBook')||{}).value;
  const b = bookById(bId);
  if(!b){ toast('Pick a book'); return; }
  const date = $('mSessDate').value || todayIso();
  let pages = Math.round(num($('mSessPages').value,0));
  const from = $('mSessFrom').value===''?'':Math.round(num($('mSessFrom').value,0));
  const to = $('mSessTo').value===''?'':Math.round(num($('mSessTo').value,0));
  if(from!=='' && to!=='' && to>from) pages = to-from+1;
  if(pages<=0){ toast('Pages read is required'); return; }
  const minutes = $('mSessMin').value===''?'':clamp(Math.round(num($('mSessMin').value,0)),0,1440);
  const note = ($('mSessNote').value||'').trim();
  if(id){
    const s = db.sessions.find(x=>x.id===id);
    if(!s){ toast('Session not found'); return; }
    const oldBook = bookById(s.bookId);
    if(oldBook && oldBook.id!==b.id) applySessionDelta(oldBook, s.pages, 0);   /* move out of old book */
    applySessionDelta(b, (oldBook&&oldBook.id===b.id)?s.pages:0, pages);       /* apply delta on new book */
    Object.assign(s, {bookId:b.id, date, pages, from, to, minutes, note});
    checkAutoFinish(b, date);
    save(); closeModal(); refresh();
    toast('Session updated ✓');
  } else {
    const s = {id:uid(), bookId:b.id, date, pages, from, to, minutes, note};
    applySessionDelta(b, 0, pages);
    db.sessions.push(s);
    const justFinished = checkAutoFinish(b, date);
    save(); closeModal(); refresh();
    if(justFinished){ confettiCenter(); toast('"'+b.title.slice(0,28)+'" finished — marked as read!'); }
    else toast('Session logged — +'+pages+' pages ✓');
  }
};
ACT['sess-del'] = el=>{
  armDelete(el, ()=>{
    const s = db.sessions.find(x=>x.id===el.dataset.id);
    if(!s) return;
    const b = bookById(s.bookId);
    applySessionDelta(b, s.pages, 0);   /* give the pages back */
    db.sessions = db.sessions.filter(x=>x.id!==s.id);
    save(); refresh();
    toast('Session deleted — progress adjusted');
  });
};

function openReviewModal(bookId, rev){
  const isNew = !rev;
  const candidates = db.books.filter(b=>b.status==='read');
  const selId = rev ? rev.bookId : (bookId || (candidates[0]&&candidates[0].id) || revBook || (db.books[0]&&db.books[0].id) || '');
  if(!db.books.length){ toast('Add a book first'); return; }
  const cur = rev ? rev.rating : 0;
  openModal(`<h3>${isNew?'Write a <em>review</em>':'Edit <em>review</em>'}</h3>
    <div class="field" style="margin-top:10px"><span>Book</span>
      <select class="in" id="mRevBook">${db.books.map(b=>`<option value="${b.id}"${b.id===selId?' selected':''}>${esc(b.title)}${b.status==='read'?'':' (not finished)'}</option>`).join('')}</select></div>
    <div class="field"><span>Star rating</span>
      <div class="star-pick" id="mRevStars">${[1,2,3,4,5].map(n=>`<button type="button" data-act="rev-star" data-v="${n}" aria-label="${n} star${n===1?'':'s'}">${starSvg(cur>=n,22)}</button>`).join('')}</div>
      <input type="hidden" id="mRevRating" value="${cur}"></div>
    <div class="field"><span>Review</span>
      <textarea class="in" id="mRevText" maxlength="2000" style="min-height:90px" placeholder="What did this book give you? Who should read it?">${esc(rev?rev.text:'')}</textarea></div>
    <div class="field"><span>Favorite quotes (optional)</span>
      <textarea class="in" id="mRevQuotes" maxlength="1000" style="min-height:56px" placeholder="&ldquo;A line that stayed with you&rdquo;">${esc(rev?rev.quotes:'')}</textarea></div>
    <div class="modal-actions"><button class="btn" data-act="modal-close">Cancel</button>
    <button class="btn btn-primary" data-act="review-save" data-id="${rev?rev.id:''}">${icon('check')} Save review</button></div>`, true);
  if(!isNew) window.__revStars = rev.rating; else window.__revStars = 0;
}
ACT['review-add'] = ()=>{ window.__revStars = 0; openReviewModal('','', null); };
ACT['review-for'] = el=>{ window.__revStars = 0; openReviewModal(el.dataset.id, null); };
ACT['review-edit'] = el=>{
  const r = db.reviews.find(x=>x.id===el.dataset.id);
  if(r){ window.__revStars = r.rating; openReviewModal('', r); } else toast('Review not found');
};
ACT['rev-star'] = el=>{
  const v = clamp(parseInt(el.dataset.v,10)||0,0,5);
  window.__revStars = v;
  const wrap = $('mRevStars');
  if(wrap) wrap.querySelectorAll('button').forEach((btn,i)=>{ btn.innerHTML = starSvg((i+1)<=v,22); });
  const hid = $('mRevRating'); if(hid) hid.value = v;
};
ACT['review-save'] = el=>{
  const id = el.dataset.id;
  const bookId = ($('mRevBook')||{}).value;
  const b = bookById(bookId);
  if(!b){ toast('Pick a book'); return; }
  const rating = clamp(num($('mRevRating').value,0),0,5);
  const text = ($('mRevText').value||'').trim();
  const quotes = ($('mRevQuotes').value||'').trim();
  if(!rating && !text){ toast('Add a rating or a few words'); return; }
  if(id){
    const r = db.reviews.find(x=>x.id===id);
    if(!r){ toast('Review not found'); return; }
    Object.assign(r, {bookId, rating, text, quotes});
  } else {
    db.reviews.push({id:uid(), bookId, rating, text, quotes, date:todayIso()});
  }
  if(rating>0) b.rating = rating;   /* keep book rating in sync with the review */
  save(); closeModal(); refresh();
  toast('Review saved ✓');
};
ACT['review-del'] = el=>{
  armDelete(el, ()=>{
    db.reviews = db.reviews.filter(x=>x.id!==el.dataset.id);
    save(); refresh();
    toast('Review deleted');
  });
};
